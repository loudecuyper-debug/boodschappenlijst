<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Boodschappen">

<title>Boodschappenlijst</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-1024.png?v=2">
<link rel="icon" href="icon-1024.png?v=2">
<style>
@font-face{font-family:'Schibsted Grotesk';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/schibsted-400.woff2) format('woff2')}
@font-face{font-family:'Schibsted Grotesk';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/schibsted-600.woff2) format('woff2')}
@font-face{font-family:'Schibsted Grotesk';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/schibsted-700.woff2) format('woff2')}
@font-face{font-family:'Schibsted Grotesk';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/schibsted-800.woff2) format('woff2')}
:root{
  --bg:#FFFFFF; --band:#EAF2EB; --titel:#14301E; --tekst:#1B211C; --zacht:#4F5C52; --stil:#5F6A61;
  --lijn:#E6E9E5; --veld:#F2F4F1; --primair:#1E5B3B; --offline:#8A4206;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tekst);font-family:'Schibsted Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-text-size-adjust:100%;touch-action:manipulation}
button,input{touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.band{background:var(--band);padding:calc(env(safe-area-inset-top) + 16px) 20px 16px}
.band h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-0.03em;line-height:38px;color:var(--titel)}
.sub{display:flex;align-items:center;gap:6px;font-size:15px;line-height:20px;color:var(--zacht);min-height:20px}
.sub .off{display:flex;align-items:center;gap:4px;color:var(--offline)}
.invoer{display:flex;align-items:center;gap:10px;margin-top:16px;height:48px;padding:0 14px;background:#FFFFFF;border-radius:10px}
.plusknop{width:44px;height:44px;margin:0 -12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:10px}
.invoer input{border:0;outline:0;background:transparent;font:inherit;font-size:17px;flex:1;min-width:0;color:var(--tekst)}
.invoer input::placeholder{color:var(--stil)}
.kop{display:flex;align-items:center;gap:8px;padding:28px 20px 8px;font-size:14px;font-weight:600;color:var(--zacht);line-height:20px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.rij{display:flex;align-items:center;gap:12px;width:100%;padding:0 0 0 20px;text-align:left;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cirkel{width:24px;height:24px;border-radius:50%;border:2px solid;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.inhoud{display:flex;align-items:center;flex:1;min-width:0;min-height:52px;border-bottom:1px solid var(--lijn);padding-right:20px;gap:12px}
.naam{font-size:17px;flex:1;min-width:0;overflow-wrap:anywhere}
.qty{font-size:15px;color:var(--stil);font-variant-numeric:tabular-nums}
.rij.af{color:var(--stil)}
.rij.af .naam{text-decoration:line-through}
.leeg{padding:48px 20px;font-size:15px;line-height:22px;color:var(--stil)}
.balk{position:fixed;left:0;right:0;bottom:0;background:#FFFFFF;border-top:1px solid var(--lijn);padding:12px 20px calc(env(safe-area-inset-bottom) + 12px)}
.balk button{width:100%;height:52px;border-radius:10px;background:var(--primair);color:#FFFFFF;font-size:17px;font-weight:600}
.ruimte{height:24px}
.ruimte.met-balk{height:calc(env(safe-area-inset-bottom) + 100px)}
.hint{margin-top:8px;font-size:14px;line-height:20px;color:var(--zacht)}
.hint:empty{display:none}
.topregel{display:flex;align-items:center;justify-content:space-between}
.icoonknop{width:44px;height:44px;margin-right:-10px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.sugs{display:flex;gap:8px;margin-top:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sugs::-webkit-scrollbar{display:none}
.sugs:empty{display:none}
.sugs button{flex-shrink:0;height:40px;padding:0 14px;border-radius:10px;background:#FFFFFF;font-size:15px;color:var(--tekst);display:flex;align-items:center;gap:8px;white-space:nowrap}
.toast{position:fixed;left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom) + 16px);background:#1B211C;color:#FFFFFF;border-radius:10px;padding:0 6px 0 16px;min-height:52px;display:flex;align-items:center;gap:12px;font-size:15px;z-index:5}
.toast[hidden]{display:none}
.toast button{margin-left:auto;height:44px;padding:0 10px;color:#BFE3C6;font-weight:600;font-size:15px;white-space:nowrap}
.overlay{position:fixed;inset:0;background:rgba(20,30,22,.45);display:flex;flex-direction:column;justify-content:flex-end;z-index:10}
.overlay[hidden]{display:none}
.sheet{background:#FFFFFF;border-radius:16px 16px 0 0;padding:8px 20px calc(env(safe-area-inset-bottom) + 20px);max-height:92vh;overflow-y:auto;display:flex;flex-direction:column;gap:24px}
.greep{width:36px;height:5px;border-radius:3px;background:#D3D8D2;align-self:center;flex-shrink:0}
.sheetkop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:-8px}
.sheetkop h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-0.02em;display:flex;align-items:center;gap:10px;min-width:0;overflow-wrap:anywhere}
.sheetkop .dot{width:12px;height:12px}
.tekstknop{height:44px;padding:0 4px;font-size:17px;font-weight:600;color:var(--primair)}
.label{font-size:14px;font-weight:600;color:var(--zacht);line-height:20px;margin-bottom:10px}
.stepper{display:flex;gap:8px}
.stepper button,.stepper output{height:48px;border-radius:10px;background:var(--veld);display:flex;align-items:center;justify-content:center}
.stepper button{width:52px}
.stepper output{flex:1;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.raster{display:grid;gap:6px;margin-top:8px}
.raster.zes{grid-template-columns:repeat(6,minmax(0,1fr))}
.raster.twee{grid-template-columns:repeat(2,minmax(0,1fr))}
.keuze{height:44px;border-radius:10px;background:var(--veld);font-size:15px;border:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 8px;white-space:nowrap;overflow:hidden}
.raster.twee .keuze{justify-content:flex-start;font-size:13px}
.keuze.aan{background:#FFFFFF;font-weight:600}
.weg{height:52px;border-radius:10px;background:#FCEDEB;color:#A8261B;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0}
.pagina{position:fixed;inset:0;background:#FFFFFF;overflow-y:auto;z-index:20}
.pagina[hidden]{display:none}
.terug{display:inline-flex;align-items:center;gap:4px;height:44px;margin-left:-6px;font-size:17px;font-weight:500;color:var(--primair)}
.uitleg{padding:28px 20px 8px}
.uitleg p{margin:4px 0 0;font-size:15px;line-height:21px;color:var(--stil)}
.sleeprij{display:flex;align-items:center;gap:12px;padding-left:20px;background:#FFFFFF}
.sleeprij .inhoud{padding-right:8px}
.sleeprij.sleept{background:var(--veld);position:relative;z-index:1}
.greepknop{width:44px;height:44px;display:flex;align-items:center;justify-content:center;touch-action:none}
.voet{padding:12px 20px calc(env(safe-area-inset-bottom) + 24px);font-size:14px;line-height:20px;color:var(--stil)}
.fout{margin:16px 20px;padding:12px 14px;border-radius:10px;background:#FCEDEB;color:#A8261B;font-size:15px;line-height:21px}
</style>

<body>
<header class="band">
  <div class="topregel">
    <h1>Boodschappen</h1>
    <button class="icoonknop" id="openInst" type="button" aria-label="Instellingen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14301E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>
  <div class="sub" id="sub"></div>
  <form class="invoer" id="form" autocomplete="off">
    <button class="plusknop" id="plus" type="submit" aria-label="Toevoegen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E5B3B" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <input id="invoer" aria-label="Item toevoegen" placeholder="Wat moet er nog bij?" enterkeyhint="done" maxlength="60" autocapitalize="sentences" autocorrect="on">
  </form>
  <div class="sugs" id="sugs"></div>
  <div class="hint" id="hint" aria-live="polite"></div>
</header>
<main id="lijst"></main>
<div class="balk" id="balk" hidden><button id="klaar" type="button">Klaar met winkelen</button></div>
<div class="toast" id="toast" role="status" hidden><span id="toastTekst"></span><button id="toastKnop" type="button">Ongedaan maken</button></div>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Item aanpassen"></div></div>
<div class="pagina" id="inst" hidden></div>

<script>
// ---------- Categorieën (design system, tab 4) ----------
const CATS = [
  ['groenten', 'Groenten & fruit', '#3F8A3A'], ['brood', 'Brood & bakkerij', '#A6741C'],
  ['vlees', 'Vlees & vis', '#B5443A'], ['beleg', 'Charcuterie & kaas', '#C0602F'],
  ['zuivel', 'Zuivel & eieren', '#3473B5'], ['klaar', 'Kant-en-klaar', '#9C5B8F'],
  ['pasta', 'Pasta & wereld', '#9A7A10'], ['conserven', 'Conserven & sauzen', '#5B6FA8'],
  ['ontbijt', 'Ontbijt & zoet', '#7A5236'], ['snacks', 'Koeken & snacks', '#C04A6E'],
  ['bakken', 'Bakken & kruiden', '#6F7A2A'], ['dranken', 'Dranken', '#25848C'],
  ['diepvries', 'Diepvries', '#2F86B8'], ['huishouden', 'Huishouden', '#7660AA'],
  ['verzorging', 'Verzorging', '#A0529E'], ['overige', 'Overige', '#6E7A70']
];
const CAT = Object.fromEntries(CATS.map(([id, naam, kleur]) => [id, { id, naam, kleur }]));

// ---------- Woordenlijst (Vlaams) ----------
const WOORDEN = {
  groenten: 'appel|peer|peren|banaan|sinaasappel|appelsien|mandarijn|clementine|citroen|limoen|druif|aardbei|framboos|frambozen|bosbes|blauwe bes|kers|kiwi|mango|ananas|meloen|watermeloen|perzik|nectarine|pruim|abrikoos|abrikozen|vijg|granaatappel|avocado|tomaat|kerstomaat|trostomaat|komkommer|paprika|courgette|aubergine|ui|uien|ajuin|rode ui|sjalot|look|knoflook|lookteen|prei|wortel|wortelen|aardappel|patat|krieltjes|zoete aardappel|broccoli|bloemkool|spruitjes|witloof|sla|ijsbergsla|kropsla|rucola|spinazie|veldsla|selder|selderij|venkel|champignon|paddenstoel|boon|boontjes|sperziebonen|prinsessenbonen|erwtjes|peultjes|maiskolf|rode biet|radijs|rode kool|witte kool|savooikool|boerenkool|pastinaak|knolselder|gember|peterselie|basilicum|munt|koriander|bieslook|dille|lente-ui|pompoen|asperge|groenten|fruit|soepgroenten|wokgroenten|pepers|chilipeper',
  brood: 'brood|volkorenbrood|wit brood|bruin brood|meergranenbrood|pistolet|sandwich|boterkoek|croissant|chocoladebroodje|koffiekoek|stokbrood|baguette|ciabatta|focaccia|wrap|pitabrood|pita|toast|toastbrood|beschuit|piccolo|rozijnenbrood|krentenbrood|suikerbrood|naanbrood|hamburgerbroodje|hotdogbroodje|taart|cake|broodjes|pistolets|sandwiches',
  vlees: 'gehakt|kipfilet|kip|kippenbouten|kippenbil|kippenvleugels|steak|biefstuk|varkenshaasje|varkensvlees|rundvlees|kalfsvlees|spek|spekblokjes|lardons|braadworst|chipolata|hamburger|ribbetjes|kotelet|gyros|kebab|stoofvlees|zalm|zalmfilet|kabeljauw|vis|visfilet|scampi|garnaal|garnalen|mosselen|tonijnsteak|kalkoen|lamsvlees|eend|cordon bleu|schnitzel|blinde vinken|gehaktballen|vleesbrood|worsten',
  beleg: 'hesp|ham|gekookte hesp|rauwe hesp|salami|kipwit|kalkoenfilet|prepare|filet americain|pate|boulogne|kaas|gouda|jonge kaas|oude kaas|brie|camembert|mozzarella|burrata|parmezaan|feta|geitenkaas|emmentaler|cheddar|gruyere|raclettekaas|kaasblokjes|geraspte kaas|gemalen kaas|chorizo|prosciutto|pancetta|leverworst|charcuterie|beleg',
  zuivel: 'melk|halfvolle melk|volle melk|magere melk|havermelk|sojamelk|amandelmelk|rijstmelk|karnemelk|chocomelk|yoghurt|griekse yoghurt|drinkyoghurt|platte kaas|kwark|skyr|room|slagroom|kookroom|zure room|creme fraiche|boter|margarine|ei|eieren|pudding|mascarpone|ricotta|cottage cheese|vla|zuivel',
  klaar: 'soep|verse soep|pizza|lasagne|verse pasta|tortellini|ravioli|gnocchi|hummus|quiche|maaltijdsalade|slaatje|vol-au-vent|sushi|tzatziki|dip|kant-en-klaar|spaghettisaus|bolognese|balletjes in tomatensaus|kippensoep|tomatensoep',
  pasta: 'pasta|spaghetti|penne|fusilli|farfalle|tagliatelle|macaroni|lasagnebladen|rijst|basmatirijst|risottorijst|zilvervliesrijst|couscous|bulgur|quinoa|noedels|mie|rijstnoedels|tortilla|tortillawraps|taco|tacoschelpen|kokosmelk|currypasta|sojasaus|woksaus|sushirijst|nori|linzen|wereldkeuken',
  conserven: 'tomatenpuree|passata|tomatenblokjes|gepelde tomaten|tomatensaus|pastasaus|pesto|kikkererwten|witte bonen|bruine bonen|kidneybonen|bonen in tomatensaus|mais|tonijn|sardines|olijven|augurken|zilveruitjes|mayonaise|ketchup|mosterd|curry|currysaus|bbq-saus|andalouse|cocktailsaus|samuraisaus|olijfolie|olie|zonnebloemolie|frituurolie|azijn|balsamico|appelmoes|ansjovis|kappertjes|tapenade|champignons in blik|saus|conserven',
  ontbijt: 'choco|chocopasta|nutella|confituur|jam|honing|siroop|speculoospasta|pindakaas|hagelslag|muisjes|muesli|granola|havermout|cornflakes|ontbijtgranen|cruesli|rijstwafels|ontbijt',
  snacks: 'koekjes|koeken|chocolade|chocoladereep|reep|chips|nootjes|noten|cashewnoten|pindas|borrelnootjes|snoep|gummies|drop|popcorn|crackers|toastjes|speculoos|wafels|mueslireep|snacks|apero',
  bakken: 'bloem|zelfrijzende bloem|suiker|bruine suiker|kristalsuiker|poedersuiker|bakpoeder|gist|vanillesuiker|zout|peper|paprikapoeder|kerriepoeder|komijn|oregano|tijm|rozemarijn|laurier|nootmuskaat|kaneel|bouillon|bouillonblokjes|maizena|cacaopoeder|chocoladedruppels|rozijnen|amandelen|kruiden|specerijen',
  dranken: 'water|bruiswater|plat water|spuitwater|cola|cola zero|fanta|sprite|ice tea|limonade|fruitsap|sap|sinaasappelsap|appelsap|multivitaminesap|smoothie|bier|pils|wijn|rode wijn|witte wijn|rose|cava|prosecco|champagne|koffie|koffiebonen|koffiepads|koffiecapsules|thee|kruidenthee|tonic|energiedrank|frisdrank|drank',
  diepvries: 'ijs|ijsjes|roomijs|diepvriesgroenten|frietjes|friet|frieten|kroketten|diepvriespizza|vissticks|ijsblokjes|diepvriesfruit|loempia|bitterballen|diepvries',
  huishouden: 'wc-papier|wcpapier|toiletpapier|keukenrol|keukenpapier|afwasmiddel|vaatwastabletten|vaatwaszout|glansspoelmiddel|wasmiddel|wasverzachter|vuilniszakken|vuilzakken|pmd-zakken|allesreiniger|javel|schoonmaakmiddel|sponsjes|aluminiumfolie|zilverpapier|plasticfolie|diepvrieszakjes|bakpapier|kaarsen|batterijen|servetten|zakdoeken|ontkalker|huishouden',
  verzorging: 'tandpasta|tandenborstel|shampoo|conditioner|douchegel|zeep|handzeep|deodorant|deo|scheermesjes|scheerschuim|maandverband|tampons|dagcreme|bodylotion|zonnecreme|wattenstaafjes|watten|flosdraad|mondwater|pleisters|paracetamol|ibuprofen|lenzenvloeistof|haargel|verzorging'
};

// ---------- Normaliseren ----------
const UITZONDERINGEN = { eieren: 'ei', uien: 'ui', peren: 'peer', kinderen: 'kind' };
const HOUD_S = new Set(['chips', 'kaas', 'ananas', 'ijs', 'saus', 'jus', 'hummus', 'couscous', 'mais', 'muis', 'kers', 'spruitjes']);
function enkelvoud(w) {
  if (UITZONDERINGEN[w]) return UITZONDERINGEN[w];
  if (w.endsWith("'s")) return w.slice(0, -2);
  if (w.length >= 5 && w.endsWith('en') && !/(een|ien)$/.test(w)) {
    let s = w.slice(0, -2);
    if (/([bcdfghjklmnpqrstvwxz])\1$/.test(s)) s = s.slice(0, -1);
    else if (/[^aeiou][aou][^aeiouyj]$/.test(s) && !/[aeiou]{2}[^aeiou]$/.test(s)) s = s.slice(0, -1) + s.slice(-2, -1) + s.slice(-1);
    if (s.endsWith('v')) s = s.slice(0, -1) + 'f';
    else if (s.endsWith('z')) s = s.slice(0, -1) + 's';
    return s;
  }
  if (w.length >= 4 && w.endsWith('s') && !HOUD_S.has(w) && (!/[aeious]s$/.test(w) || w.endsWith('jes'))) return w.slice(0, -1);
  return w;
}
function sleutelVan(naam) {
  const t = String(naam).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[‘’]/g, "'").replace(/-/g, '').replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
  return t.split(' ').filter(Boolean).map(enkelvoud).join(' ').replace(/'/g, '').slice(0, 60);
}
const LEXICON = new Map();
for (const [cat, lijst] of Object.entries(WOORDEN)) {
  for (const woord of lijst.split('|')) {
    const k = sleutelVan(woord);
    LEXICON.set(k, cat);
    LEXICON.set(k.replace(/ /g, ''), cat);
  }
}
function categorieVan(sleutel) {
  if (!sleutel) return 'overige';
  if (LEXICON.has(sleutel)) return LEXICON.get(sleutel);
  const samen = sleutel.replace(/ /g, '');
  if (LEXICON.has(samen)) return LEXICON.get(samen);
  const woorden = sleutel.split(' ');
  const laatste = woorden[woorden.length - 1];
  // verkleinwoorden: kerstomaatje -> kerstomaat, worteltje -> wortel, erwtje -> erwt
  const vormen = [laatste];
  if (laatste.endsWith('je')) for (const s of ['je', 'tje', 'pje', 'etje']) if (laatste.endsWith(s)) vormen.push(laatste.slice(0, -s.length));
  for (const w of vormen) if (w.length >= 2 && LEXICON.has(w)) return LEXICON.get(w);
  let best = null; // samenstellingen: het langste woord uit de lijst waarop het laatste woord eindigt
  for (const [k] of LEXICON) {
    if (k.length < 3 || k.includes(' ')) continue;
    if (vormen.some((v) => v.length >= 3 && v.endsWith(k)) && (!best || k.length > best.length)) best = k;
  }
  if (best) return LEXICON.get(best);
  for (const w of woorden) if (LEXICON.has(w)) return LEXICON.get(w);
  return 'overige';
}

// ---------- Invoer herkennen: "2 melk", "500g gehakt", "melk x2", "aardappelen 2 kg" ----------
const EENHEDEN = { x: null, '×': null, st: null, stuk: null, stuks: null, g: 'g', gr: 'g', gram: 'g', kg: 'kg', kilo: 'kg', ml: 'ml', cl: 'cl', l: 'l', liter: 'l' };
function parseInvoer(tekst) {
  let t = String(tekst).replace(/\s+/g, ' ').trim();
  const N = '(\\d+(?:[.,]\\d+)?)';
  const U = '(x|×|st|stuks|stuk|g|gr|gram|kg|kilo|ml|cl|l|liter)';
  let q = null, e = null, m;
  if ((m = t.match(new RegExp('^' + N + '\\s*' + U + '?\\s+(.+)$', 'i')))) { q = m[1]; e = m[2]; t = m[3]; }
  else if ((m = t.match(new RegExp('^(.+?)\\s+(?:x\\s*' + N + '|' + N + '\\s*x)$', 'i')))) { t = m[1]; q = m[2] || m[3]; }
  else if ((m = t.match(new RegExp('^(.+?)\\s+' + N + '\\s*(g|gr|gram|kg|kilo|ml|cl|l|liter)$', 'i')))) { t = m[1]; q = m[2]; e = m[3]; }
  let n = q == null ? null : parseFloat(String(q).replace(',', '.'));
  let eenheid = e ? EENHEDEN[e.toLowerCase()] : null;
  if (eenheid === 'cl') { n = n * 10; eenheid = 'ml'; }

  if (n == null) eenheid = null;
  else n = Math.round(n * 100) / 100;
  return { naam: t, hoeveelheid: n, eenheid };
}

// ---------- State ----------
const S = {
  items: [],
  volgorde: CATS.map((c) => c[0]),
  sync: { offline: !navigator.onLine, wachtend: 0, sinds: 0 },
  geladen: false,

  detail: null,
  fout: ''

let FB = null;

// ---------- Helpers ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const netjes = (naam) => { const t = naam.replace(/\s+/g, ' ').trim().slice(0, 60); return t.charAt(0).toLocaleUpperCase('nl-BE') + t.slice(1); };
const qtyTekst = (it) => it.hoeveelheid == null ? '' : String(it.hoeveelheid).replace('.', ',') + (it.eenheid && it.eenheid !== 'st' ? ' ' + it.eenheid : '');
const lijstItems = () => S.items.filter((i) => !S.weg.has(i.id));
const plat = (s) => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function categorieVoor(sleutel) {

}
const vergelijk = (a, b) => a.naam.localeCompare(b.naam, 'nl-BE', { sensitivity: 'base' });

// ---------- Render ----------
function renderSub() {
  const zicht = lijstItems();
  const open = zicht.filter((i) => !i.afgevinkt).length;
  const af = zicht.length - open;
  let tekst = af > 0 ? `${open} te gaan` : `${open} ${open === 1 ? 'item' : 'items'}`;
  if (!S.geladen) tekst = 'Laden…';
  const lang = S.sync.wachtend > 0 && Date.now() - S.sync.sinds > 2500;
  let status = '';
  if (S.sync.offline) status = 'offline' + (S.sync.wachtend > 0 ? `, ${S.sync.wachtend} wachten` : '');
  else if (lang) status = `${S.sync.wachtend} ${S.sync.wachtend === 1 ? 'wijziging wacht' : 'wijzigingen wachten'}`;
  $('sub').innerHTML = esc(tekst) + (status
    ? '<span aria-hidden="true">·</span><span class="off"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A4206" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M9.5 6.2A6 6 0 0 1 17.7 10H18a4 4 0 0 1 2.3 7.3M16 18H6a4 4 0 0 1-.6-8"/></svg>' + esc(status) + '</span>'
    : '');
}

function rijHtml(it, af) {
  const kleur = (CAT[it.categorie] || CAT.overige).kleur;
  const cirkel = af
    ? `<span class="cirkel" style="background:${kleur};border-color:${kleur}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>`
    : `<span class="cirkel" style="border-color:${kleur}"></span>`;
  return `<button class="rij${af ? ' af' : ''}" data-id="${esc(it.id)}" aria-pressed="${af}">${cirkel}<span class="inhoud"><span class="naam">${esc(it.naam)}</span><span class="qty">${esc(qtyTekst(it))}</span></span></button>`;
}

function render() {
  renderSub();
  const zicht = lijstItems();
  const open = zicht.filter((i) => !i.afgevinkt);
  const mandje = zicht.filter((i) => i.afgevinkt).sort((a, b) => (b.afgevinktOp || 0) - (a.afgevinktOp || 0));
  let html = S.fout ? `<div class="fout">${esc(S.fout)}</div>` : '';
  if (S.geladen && zicht.length === 0) html += '<div class="leeg">De lijst is leeg. Typ hierboven wat er nog bij moet.</div>';
  const volgorde = [...S.volgorde.filter((c) => c !== 'overige'), 'overige'];
  for (const cid of volgorde) {
    const groep = open.filter((i) => (CAT[i.categorie] ? i.categorie : 'overige') === cid).sort(vergelijk);
    if (!groep.length) continue;
    html += `<div class="kop"><span class="dot" style="background:${CAT[cid].kleur}"></span>${esc(CAT[cid].naam)}</div>`;
    html += groep.map((it) => rijHtml(it, false)).join('');
  }
  if (mandje.length) {
    html += `<div class="kop">In mandje · ${mandje.length}</div>`;
    html += mandje.map((it) => rijHtml(it, true)).join('');

// ---------- Acties ----------
let hintTimer = 0;
function toonHint(tekst) {
  $('hint').textContent = tekst;
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { $('hint').textContent = ''; }, 3000);
}
function voegToe(tekst) {
  if (!FB) return false;
  const p = parseInvoer(tekst);
  const naam = netjes(p.naam);
  if (!naam) return false;
  const sleutel = sleutelVan(naam);
  if (!sleutel) return false;
  const zicht = lijstItems();
  const bestaand = zicht.find((i) => i.sleutel === sleutel && !i.afgevinkt) || zicht.find((i) => i.sleutel === sleutel);
  if (bestaand) {
    let hoeveelheid = p.hoeveelheid, eenheid = p.eenheid, melding;
    const oud = bestaand.eenheid || null;
    if (bestaand.afgevinkt) {
      melding = `${bestaand.naam} staat terug op de lijst`;
    } else if (hoeveelheid == null && oud) {
      toonHint(`${bestaand.naam} staat er al op (${qtyTekst(bestaand)})`);
      return true;
    } else if ((eenheid || null) === oud) {
      hoeveelheid = Math.round(((bestaand.hoeveelheid ?? 1) + (hoeveelheid ?? 1)) * 100) / 100;
      eenheid = oud;
      melding = `${bestaand.naam} stond er al op, nu ${qtyTekst({ hoeveelheid, eenheid })}`;
    } else {
      melding = `${bestaand.naam} aangepast naar ${qtyTekst({ hoeveelheid, eenheid })}`;
    }
    FB.update(bestaand.id, { hoeveelheid, eenheid, afgevinkt: false, afgevinktOp: null });
    toonHint(melding);
    return true;
  }
  FB.add({ naam, sleutel, hoeveelheid: p.hoeveelheid, eenheid: p.eenheid, categorie: categorieVoor(sleutel), afgevinkt: false, afgevinktOp: null });
  return true;
}
function wissel(id) {

}
let uitstel = null;
function verwijderLater(lijst, tekst, metCatalogus) {
  if (uitstel) voerUit();
  lijst.forEach((i) => S.weg.add(i.id));
  uitstel = { lijst, metCatalogus, timer: setTimeout(voerUit, 5000) };
  $('toastTekst').textContent = tekst;
  $('toast').hidden = false;
  render();
}
function voerUit() {
  if (!uitstel) return;
  const { lijst, metCatalogus, timer } = uitstel;
  uitstel = null;
  clearTimeout(timer);
  $('toast').hidden = true;
  if (FB) FB.finish(lijst.map((i) => ({ id: i.id, sleutel: i.sleutel, naam: i.naam, categorie: i.categorie })), metCatalogus);
}
function ongedaan() {
  if (!uitstel) return;
  clearTimeout(uitstel.timer);

  $('toast').hidden = true;

}
function klaarMetWinkelen() {

  if (lijst.length) verwijderLater(lijst, `${lijst.length} ${lijst.length === 1 ? 'item' : 'items'} opgeruimd`, true);
}

// ---------- Suggesties tijdens het typen ----------
const ALGEMEEN = new Set(['groenten', 'fruit', 'beleg', 'zuivel', 'ontbijt', 'snacks', 'huishouden', 'verzorging', 'diepvries', 'drank', 'conserven', 'wereldkeuken', 'kant-en-klaar', 'charcuterie', 'apero', 'kruiden', 'specerijen', 'saus', 'sap']);
const WOORDLIJST = [...new Set(Object.values(WOORDEN).flatMap((l) => l.split('|')))].filter((w) => !ALGEMEEN.has(w));
function voorvoegsel(tekst) {
  const p = parseInvoer(tekst);
  if (p.hoeveelheid == null || !/^\s*\d/.test(tekst)) return '';
  const i = plat(tekst).lastIndexOf(plat(p.naam));
  return i > 0 ? tekst.slice(0, i).trim() : '';
}
function renderSugs() {
  const tekst = $('invoer').value;
  const q = plat(parseInvoer(tekst).naam).trim();
  if (!q || /^\d/.test(q)) { $('sugs').innerHTML = ''; return; }
  const opLijst = new Set(lijstItems().filter((i) => !i.afgevinkt).map((i) => i.sleutel));
  const gezien = new Set();
  const uit = [];
  const probeer = (naam) => {
    if (uit.length >= 5 || !naam) return;
    const k = sleutelVan(naam);
    if (!k || gezien.has(k) || opLijst.has(k) || plat(naam) === q) return;
    if (!plat(naam).split(/[\s-]+/).some((w) => w.startsWith(q))) return;
    gezien.add(k);
    uit.push(netjes(naam));
  };
  Object.values(S.catalogus)
    .sort((a, b) => (b.aantal || 0) - (a.aantal || 0) || (b.laatst || 0) - (a.laatst || 0))
    .forEach((c) => probeer(c && c.naam));
  // eerst woorden die met de getypte letters beginnen, daarna woorden waarin een deel ermee begint
  for (const w of WOORDLIJST) { if (uit.length >= 5) break; if (plat(w).startsWith(q)) probeer(w); }
  for (const w of WOORDLIJST) { if (uit.length >= 5) break; probeer(w); }
  $('sugs').innerHTML = uit.map((n) => `<button type="button" data-sug="${esc(n)}"><span class="dot" style="background:${CAT[categorieVoor(sleutelVan(n))].kleur}"></span>${esc(n)}</button>`).join('');
}

// ---------- Item aanpassen (lang drukken) ----------
const EENHEID_KNOPPEN = ['geen', 'st', 'g', 'kg', 'ml', 'l'];
const STAP = { st: 1, g: 50, kg: 0.5, ml: 50, l: 0.5 };
const STANDAARD = { st: 1, g: 500, kg: 1, ml: 500, l: 1 };
const eenheidVan = (it) => (it.hoeveelheid == null ? 'geen' : it.eenheid || 'st');
function openDetail(id) {
  S.detail = id;
  renderDetail();
  $('overlay').hidden = false;
}
function sluitDetail() {
  S.detail = null;
  $('overlay').hidden = true;
}
function renderDetail() {
  const it = lijstItems().find((i) => i.id === S.detail);
  if (!it) { sluitDetail(); return; }
  const cat = CAT[it.categorie] || CAT.overige;
  const e = eenheidVan(it);
  const min = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B211C" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>';
  const plus = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B211C" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
  const vuilbak = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A8261B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
  $('sheet').innerHTML = `<div class="greep"></div>
    <div class="sheetkop"><h2><span class="dot" style="background:${cat.kleur}"></span><span>${esc(it.naam)}</span></h2><button class="tekstknop" type="button" data-actie="sluit">Klaar</button></div>
    <div><div class="label">Hoeveelheid</div>
      <div class="stepper"><button type="button" data-actie="min" aria-label="Minder">${min}</button><output>${esc(it.hoeveelheid == null ? 'geen' : qtyTekst(it))}</output><button type="button" data-actie="plus" aria-label="Meer">${plus}</button></div>
      <div class="raster zes">${EENHEID_KNOPPEN.map((k) => `<button type="button" class="keuze${k === e ? ' aan' : ''}" data-eenheid="${k}"${k === e ? ' style="border-color:#1E5B3B"' : ''}>${k}</button>`).join('')}</div>
    </div>
    <div><div class="label">Categorie</div>
      <div class="raster twee">${CATS.map(([cid, naam, kleur]) => `<button type="button" class="keuze${cid === it.categorie ? ' aan' : ''}" data-cat="${cid}"${cid === it.categorie ? ` style="border-color:${kleur}"` : ''}><span class="dot" style="background:${kleur}"></span>${esc(naam)}</button>`).join('')}</div>
    </div>
    <button type="button" class="weg" data-actie="verwijder">${vuilbak}Verwijderen van de lijst</button>`;
}
function detailActie(knop) {
  const it = lijstItems().find((i) => i.id === S.detail);
  if (!it || !FB) return;
  const e = eenheidVan(it);
  const zet = (hoeveelheid, eenheid) => FB.update(it.id, { hoeveelheid, eenheid });
  if (knop.dataset.actie === 'sluit') return sluitDetail();
  if (knop.dataset.actie === 'plus') {
    if (e === 'geen') return zet(1, null);
    return zet(Math.round(((it.hoeveelheid || 0) + STAP[e]) * 100) / 100, it.eenheid || null);
  }
  if (knop.dataset.actie === 'min') {
    if (e === 'geen') return;
    const v = Math.round(((it.hoeveelheid || 0) - STAP[e]) * 100) / 100;
    return v > 0 ? zet(v, it.eenheid || null) : zet(null, null);
  }
  if (knop.dataset.eenheid) {
    const k = knop.dataset.eenheid;
    if (k === e) return;
    if (k === 'geen') return zet(null, null);
    return zet(STANDAARD[k], k === 'st' ? null : k);
  }
  if (knop.dataset.cat) {
    const cid = knop.dataset.cat;
    if (cid === it.categorie) return;
    FB.update(it.id, { categorie: cid });
    FB.setCatalogus(it.sleutel, { naam: it.naam, categorie: cid, handmatig: true });
    S.catalogus[it.sleutel] = { ...(S.catalogus[it.sleutel] || {}), naam: it.naam, categorie: cid, handmatig: true };
    return;
  }
  if (knop.dataset.actie === 'verwijder') {
    sluitDetail();
    verwijderLater([it], `${it.naam} verwijderd`, false);
  }
}

// ---------- Instellingen: volgorde van de afdelingen ----------
const volgordeLijst = () => S.volgorde.filter((c) => c !== 'overige' && CAT[c]);
function openInst() {
  renderInst();
  $('inst').hidden = false;
  $('inst').scrollTop = 0;
}
function sluitInst() {
  $('inst').hidden = true;
}
function renderInst() {
  const terug = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E5B3B" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
  const greep = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7D897F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg>';
  $('inst').innerHTML = `<header class="band"><button class="terug" type="button" data-actie="terug">${terug}Lijst</button><h1 style="margin-top:4px">Instellingen</h1></header>
    <div class="uitleg"><div class="label" style="margin:0">Volgorde van de afdelingen</div><p>Sleep in de volgorde waarin je door de winkel loopt. De lijst volgt deze volgorde.</p></div>
    <div id="sleeplijst">${volgordeLijst().map((cid) => `<div class="sleeprij" data-cat="${cid}"><span class="dot" style="background:${CAT[cid].kleur}"></span><span class="inhoud"><span class="naam">${esc(CAT[cid].naam)}</span><button class="greepknop" type="button" aria-label="Verslepen: ${esc(CAT[cid].naam)}">${greep}</button></span></div>`).join('')}</div>
    <div class="voet">Overige staat altijd onderaan.</div>`;
}
let sleep = null;
function startSleep(e) {
  const knop = e.target.closest('.greepknop');
  if (!knop) return;
  e.preventDefault();
  if (knop.setPointerCapture && e.pointerId != null) { try { knop.setPointerCapture(e.pointerId); } catch (x) {} }
  const rij = knop.closest('.sleeprij');
  sleep = { rij, y: e.clientY, h: rij.offsetHeight || 52 };
  rij.classList.add('sleept');
}
function beweegSleep(e) {
  if (!sleep) return;
  e.preventDefault();
  const rijen = [...$('sleeplijst').children];
  const i = rijen.indexOf(sleep.rij);
  const dy = e.clientY - sleep.y;
  if (dy > sleep.h / 2 && i < rijen.length - 1) { rijen[i + 1].after(sleep.rij); sleep.y += sleep.h; }
  else if (dy < -sleep.h / 2 && i > 0) { rijen[i - 1].before(sleep.rij); sleep.y -= sleep.h; }
  sleep.rij.style.transform = `translateY(${e.clientY - sleep.y}px)`;
}
function stopSleep() {
  if (!sleep) return;
  sleep.rij.classList.remove('sleept');
  sleep.rij.style.transform = '';
  sleep = null;
  const nieuw = [...$('sleeplijst').children].map((r) => r.dataset.cat);
  if (nieuw.join() !== volgordeLijst().join()) {
    S.volgorde = [...nieuw, 'overige'];
    if (FB) FB.setMeta({ categorieVolgorde: S.volgorde, versie: 1 });
    render();
  }
}
function onMeta(m) {
  if (!m || !Array.isArray(m.categorieVolgorde)) return;

  S.volgorde = [...geldig, ...CATS.map((c) => c[0]).filter((c) => !geldig.includes(c))];

// ---------- Firebase-koppeling ----------
function onSnapshotData(snap) {
  S.items = snap.docs;

  for (const id of [...S.weg]) if (!ids.has(id) && !(uitstel && uitstel.lijst.some((i) => i.id === id))) S.weg.delete(id);
  const wachtend = snap.docs.filter((d) => d._pending).length || (snap.pending ? 1 : 0);
  if (wachtend && !S.sync.wachtend) S.sync.sinds = Date.now();

}

// ---------- Events ----------
$('form').addEventListener('submit', (e) => {

  $('invoer').focus();
});
$('invoer').addEventListener('input', renderSugs);
$('plus').addEventListener('pointerdown', (e) => e.preventDefault());
$('sugs').addEventListener('pointerdown', (e) => { if (e.target.closest('[data-sug]')) e.preventDefault(); });
$('sugs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-sug]');
  if (!b) return;
  const voor = voorvoegsel($('invoer').value);

  $('invoer').value = '';
  renderSugs();
  $('invoer').focus();
});
let druk = null, onderdrukKlik = false;
const stopDruk = () => { if (druk) { clearTimeout(druk.t); druk = null; } };
$('lijst').addEventListener('pointerdown', (e) => {

});
$('lijst').addEventListener('pointermove', (e) => { if (druk && Math.hypot(e.clientX - druk.x, e.clientY - druk.y) > 10) stopDruk(); });

$('sheet').addEventListener('click', (e) => { const k = e.target.closest('button'); if (k) detailActie(k); });

$('toastKnop').addEventListener('click', ongedaan);

$('inst').addEventListener('pointerdown', startSleep);

$('inst').addEventListener('pointercancel', stopSleep);
document.addEventListener('visibilitychange', () => { if (document.hidden) voerUit(); });
$('lijst').addEventListener('click', (e) => {
  if (onderdrukKlik) { onderdrukKlik = false; return; }
  const rij = e.target.closest('[data-id]');
  if (rij) wissel(rij.dataset.id);
});
$('klaar').addEventListener('click', klaarMetWinkelen);
addEventListener('online', () => { S.sync.offline = false; render(); });
addEventListener('offline', () => { S.sync.offline = true; render(); });

<script type="module">

const V = '12.19.0';
try {
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const F = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const app = initializeApp({
    apiKey: 'AIzaSyDdb1HZEOJuMDwqR4Qj7EceJavwymgHQ1U',
    authDomain: 'boodschappen-e9a2b.firebaseapp.com',
    projectId: 'boodschappen-e9a2b',
    storageBucket: 'boodschappen-e9a2b.firebasestorage.app',
    messagingSenderId: '888363747841',
    appId: '1:888363747841:web:62d7a85603309858600e00'
  });
  let db;
  try {
    db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentSingleTabManager() }) });
  } catch (e) {
    db = F.initializeFirestore(app, { localCache: F.memoryLocalCache() });
  }
  const items = F.collection(db, 'items');
  const catalogus = F.collection(db, 'catalogus');
  const meta = F.doc(db, 'meta', 'instellingen');
  const ms = (t) => (t && t.toMillis ? t.toMillis() : 0);
  window.__fbReady({
    listen(cb, err) {
      return F.onSnapshot(items, { includeMetadataChanges: true }, (snap) => {
        cb({
          docs: snap.docs.map((d) => {
            const x = d.data({ serverTimestamps: 'estimate' });
            return { ...x, id: d.id, op: ms(x.op), afgevinktOp: ms(x.afgevinktOp), _pending: d.metadata.hasPendingWrites };
          }),
          fromCache: snap.metadata.fromCache,
          pending: snap.metadata.hasPendingWrites
        });
      }, err);
    },
    add(data) { return F.setDoc(F.doc(items), { ...data, op: F.serverTimestamp() }).catch(() => {}); },
    update(id, data) { return F.updateDoc(F.doc(db, 'items', id), data).catch(() => {}); },
    setChecked(id, val) { return F.updateDoc(F.doc(db, 'items', id), { afgevinkt: val, afgevinktOp: val ? F.serverTimestamp() : null }).catch(() => {}); },
    listenCatalogus(cb) {
      return F.onSnapshot(catalogus, (snap) => {
        const o = {};
        snap.docs.forEach((d) => { const x = d.data({ serverTimestamps: 'estimate' }); o[d.id] = { ...x, laatst: ms(x.laatst) }; });
        cb(o);
      }, () => {});
    },
    listenMeta(cb) { return F.onSnapshot(meta, (d) => cb(d.exists() ? d.data() : null), () => {}); },
    setMeta(data) { return F.setDoc(meta, data, { merge: true }).catch(() => {}); },
    setCatalogus(sleutel, data) { if (!sleutel) return; return F.setDoc(F.doc(db, 'catalogus', sleutel), data, { merge: true }).catch(() => {}); },
    finish(lijst, metCatalogus) {
      const b = F.writeBatch(db);
      for (const i of lijst) {
        b.delete(F.doc(db, 'items', i.id));
        if (metCatalogus && i.sleutel) b.set(F.doc(db, 'catalogus', i.sleutel), { naam: i.naam, categorie: i.categorie || 'overige', aantal: F.increment(1), laatst: F.serverTimestamp() }, { merge: true });
      }
      return b.commit().catch(() => {});
    },
    removeMany(ids) { const b = F.writeBatch(db); ids.forEach((id) => b.delete(F.doc(db, 'items', id))); return b.commit().catch(() => {}); }
  });
} catch (e) {
  window.__fbFout(e);
}
</script>
</body>
</html>
